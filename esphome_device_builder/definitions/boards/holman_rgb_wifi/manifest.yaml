id: holman_rgb_wifi
name: Holman RGB Wifi Connected Controller
description: Imported from devices.esphome.io — see linked docs for community notes.
esphome:
  platform: esp8266
  board: esp01_1m
hardware:
  connectivity:
  - wifi
images:
- https://raw.githubusercontent.com/esphome/devices.esphome.io/main/src/docs/devices/Holman-RGB-Wifi/holman_rgb_controller.png
pins:
- gpio: 0
  available: false
  occupied_by: RGB 01 Panel Button
- gpio: 12
  available: false
  occupied_by: output_component_green
- gpio: 13
  available: false
  occupied_by: output_component_red
- gpio: 14
  available: false
  occupied_by: output_component_blue
docs_url: https://devices.esphome.io/devices/Holman-RGB-Wifi/
featured_components:
- id: panelbutton
  component_id: binary_sensor.gpio
  fields:
    pin:
      value:
        number: 0
        inverted: true
        mode:
          input: true
          pullup: true
      locked: true
    id: panelbutton
    name: RGB 01 Panel Button
- id: restart_button
  component_id: button.restart
  fields:
    disabled_by_default: true
    id: restart_button
    name: RGB 01 Restart
- id: light_rgb_1
  component_id: light.rgb
  fields:
    effects:
      value:
      - random: null
      - random:
          name: Slow Random Effect
          transition_length: 30s
          update_interval: 30s
      - random:
          name: Fast Random Effect
          transition_length: 4s
          update_interval: 5s
      - pulse: null
      - pulse:
          name: Fast Pulse
          transition_length: 0.5s
          update_interval: 0.5s
      - pulse:
          name: Slow Pulse
          update_interval: 2s
      - strobe: null
      - strobe:
          name: Strobe Effect With Custom Values
          colors:
          - state: true
            brightness: 100%
            red: 100%
            green: 90%
            blue: 0%
            duration: 500ms
          - state: false
            duration: 250ms
          - state: true
            brightness: 100%
            red: 0%
            green: 100%
            blue: 0%
            duration: 500ms
      - flicker: null
      - flicker:
          name: Flicker Effect With Custom Values
          alpha: 95%
          intensity: 1.5%
      locked: true
    red: output_component_red
    green: output_component_green
    blue: output_component_blue
    id: light_rgb_1
    name: RGB Lights
- id: output_component_red
  component_id: output.esp8266_pwm
  fields:
    pin:
      value: 13
      locked: true
    id: output_component_red
- id: output_component_green
  component_id: output.esp8266_pwm
  fields:
    pin:
      value: 12
      locked: true
    id: output_component_green
- id: output_component_blue
  component_id: output.esp8266_pwm
  fields:
    pin:
      value: 14
      locked: true
    id: output_component_blue
- id: sensor_wifi_signal_1
  component_id: sensor.wifi_signal
  fields:
    update_interval: 600s
    id: sensor_wifi_signal_1
    name: RGB 01 wifi signal
- id: uptime_sensor
  component_id: sensor.uptime
  fields:
    update_interval: 60s
    disabled_by_default: true
    id: uptime_sensor
    name: Uptime Sensor
featured_bundles:
- id: light_rgb_1_setup
  name: RGB Lights (full setup)
  component_ids:
  - output_component_red
  - output_component_green
  - output_component_blue
  - light_rgb_1
source:
  type: esphome-devices
  remote_id: Holman-RGB-Wifi
  upstream_url: https://github.com/esphome/devices.esphome.io/blob/main/src/docs/devices/Holman-RGB-Wifi/index.md
  upstream_revision: e772dce49ab9e10b1e40793df3523927313e3bb6
  content_hash: 93e80834d74dc7eb18054607cd90fe72fa8f1d4c4bac1004d26271b8707257a9
