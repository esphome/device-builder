- id: waveshare_7_dsi_touch_a_display
  name: Waveshare 7-DSI-TOUCH-A Display
  description: |
    7inch 720×1280 pixels IPS Panel display with 10-Point Touch,
    bundled with ESP32-P4-WIFI6-DEV-KIT-B.
  component_id: display.mipi_dsi
  fields:
    model:
      value: WAVESHARE-7-DSI-TOUCH-A
      locked: true
  requires: [mipi_dsi_ldo]

- id: waveshare_10_1_dsi_touch_a_display
  name: Waveshare 10.1-DSI-TOUCH-A Display
  description: |
    10.1inch 800×1280 pixels IPS Panel display with 10-Point Touch,
    bundled with ESP32-P4-WIFI6-DEV-KIT-C.
  component_id: display.mipi_dsi
  fields:
    model:
      value: WAVESHARE-10.1-DSI-TOUCH-A
      locked: true
  requires: [mipi_dsi_ldo]

- id: waveshare_display_backlight_i2c_device
  name: Waveshare DSI Display Backlight I²C Device
  description: |
    Generic I²C Device to access backlight control register on Waveshare 7-DSI-TOUCH-A and 10.1-DSI-TOUCH-A displays.
  component_id: i2c_device
  fields:
    id:
      value: waveshare_display_backlight_i2c_device
      locked: true
    i2c_id:
      value: i2c_bus
      locked: true
    address:
      value: 0x45
      locked: true
  requires: [i2c_bus]

- id: waveshare_display_backlight_output
  name: Waveshare DSI Display Backlight Output
  description: |
    Float Output Component for backlight control on Waveshare 7-DSI-TOUCH-A and 10.1-DSI-TOUCH-A displays.
  component_id: output.template
  fields:
    id:
      value: waveshare_display_backlight_output
      locked: true
    type:
      value: float
      locked: true
    write_action:
      value:
      - lambda: |-
          const uint8_t value = (uint8_t) roundf(state * 255);
          id(waveshare_display_backlight_i2c_device).write_byte(0x96, value);
      locked: true
  requires: [waveshare_display_backlight_i2c_device]

- id: waveshare_display_backlight
  name: Waveshare DSI Display Backlight
  component_id: light.monochromatic
  fields:
    id: waveshare_display_backlight
    output:
      value: waveshare_display_backlight_output
      locked: true
    name: Display Backlight
    icon: mdi:brightness-7
    restore_mode: ALWAYS_ON
    entity_category: CONFIG
  requires: [waveshare_display_backlight_output]

- id: rpi_header_spi0
  name: Raspberry Pi GPIO header SPI0 bus
  description: |
    Set up an SPI bus on the 40pin header corresponding to Raspberry Pi SPI0.
    This will allow you to use some Raspberry Pi hats with SPI peripherals.
    Use this for hats where SCLK is on header pin 23 (RPi GPIO11),
    MISO is on header pin 21 (RPi GPIO9),
    and MOSI is on header pin 19 (RPi GPIO10).
    The SPI CS will be on GPIO36 (header pin 24 / RPi GPIO8)
    or GPIO32 (conflicts with I³C connector – header pin 26 / RPi GPIO7).
  component_id: spi
  fields:
    id:
      value: rpi_header_spi0
      locked: true
    clk_pin:
      value: GPIO0
      locked: true
    mosi_pin:
      value: GPIO3
      locked: true
    miso_pin:
      value: GPIO2
      locked: true

- id: rpi_header_spi1
  name: Raspberry Pi GPIO header SPI1 bus
  description: |
    Set up an SPI bus on the 40pin header corresponding to Raspberry Pi SPI1.
    This will allow you to use some Raspberry Pi hats with SPI peripherals.
    This SPI bus conflicts with the microSD power supply and audio amplifier control.
    Use this for hats where SCLK is on header pin 40 (RPi GPIO21),
    MISO is on header pin 35 (RPi GPIO19),
    and MOSI is on header pin 38 (RPi GPIO20).
    The SPI CS will be on GPIO22 (header pin 12 / RPi GPIO18),
    GPIO21 (header pin 11 / RPi GPIO17),
    or GPIO46 (header pin 36 / RPi GPIO16).
  component_id: spi
  fields:
    id:
      value: rpi_header_spi1
      locked: true
    clk_pin:
      value: GPIO45
      locked: true
    mosi_pin:
      value: GPIO27
      locked: true
    miso_pin:
      value: GPIO53
      locked: true

- id: rpi_header_id_i2c_bus
  name: Raspberry Pi header HAT ID I²C bus
  description: |
    An I²C bus that allows you to read/write the information EEPROM on Raspberry Pi HATs.
    Conflicts with the USB-C Serial/JTAG/OTG connector.
  component_id: i2c
  fields:
    id:
      value: rpi_header_id_i2c_bus
      locked: true
    scl:
      value: GPIO25
      locked: true
    sda:
      value: GPIO24
      locked: true
    frequency: 100kHz
    sda_pullup_enabled: true
    scl_pullup_enabled: true

- id: i3c_connector_i2c_bus
  name: I³C connector as I²C bus
  description: |
    Use the I³C connector as an I²C bus to attach additional peripherals.
    This I²C bus will also be available on the 40-pin header GPIO33 and GPIO32 (SDA and SCL, respectively).
  component_id: i2c
  fields:
    id: i3c_connector_i2c_bus
    scl:
      value: GPIO32
      locked: true
    sda:
      value: GPIO33
      locked: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true

