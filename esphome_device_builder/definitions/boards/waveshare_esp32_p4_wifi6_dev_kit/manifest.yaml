id: waveshare_esp32_p4_wifi6_dev_kit
name: Waveshare ESP32-P4-WIFI6-DEV-KIT
description: |
  Waveshare ESP32-P4-WIFI6-DEV-KIT in Raspberry Pi form factor.
  Uses the ESP32-P4NRW32 or ESP32-P4NRW32X (dual-core RISC-V @ 400MHz, 16MB flash, 32MB PSRAM).
  The ESP32-P4 has no built-in radio; Wi-Fi 6 and Bluetooth are supported through the onboard ESP32-C6 co-processor.
  100M RJ45 Ethernet (with optional PoE using a hat), MIPI DSI display and MIPI CSI camera connectors, microSD slot,
  3.5mm audio jack plus onboard microphone and amplified speaker header, I2C/I3C headers, RTC battery header,
  USB-A OTG (jumper-switchable), USB-C USB serial adapter and Serial/JTAG ports, 28 user GPIOs.
  The GPIO pins use the Raspberry Pi 40-pin header layout, and some Raspberry Pi hats are compatible.
  Different revisions of the ESP32-P4-WIFI6-DEV-KIT may use engineering samples or production variants of the ESP32-P4.
  Several bundles were available, including additional components:
  **ESP32-P4-WIFI6-DEV-KIT-A:** Waveshare RPi Camera B.
  **ESP32-P4-WIFI6-DEV-KIT-B:** Waveshare RPi Camera B, Waveshare 7-DSI-TOUCH-A Display.
  **ESP32-P4-WIFI6-DEV-KIT-C:** Waveshare RPi Camera B, Waveshare 10.1-DSI-TOUCH-A Display.
manufacturer: Waveshare
images:
- https://www.waveshare.com/media/catalog/product/cache/1/image/800x800/9df78eab33525d08d6e5fb8d27136e95/e/s/esp32-p4-wifi6-dev-kit-1_3.jpg
esphome:
  platform: esp32
  board: esp32-p4-evboard
  variant: esp32p4
  framework: esp-idf
  logger_hardware_uart: UART0
hardware:
  flash_size: 16MB
  ram_size: 34381824
  cpu_frequency: 400MHz
  connectivity:
  - wifi
  - ethernet
  - bluetooth
tags:
- dev-kit
- breakout
- sd-card
- usb-c
- camera
- display
- microphone
- speaker
docs_url: https://www.waveshare.com/wiki/ESP32-P4-WIFI6-DEV-KIT
product_url: https://www.waveshare.com/esp32-p4-wifi6-dev-kit.htm
featured_components:
- id: in_package_psram
  component_id: psram
  fields:
    mode:
      value: hex
      locked: true
    speed: 200MHz
    ignore_not_found: false

- id: esp32_hosted_c6
  component_id: esp32_hosted
  name: ESP32-C6 wireless co-processor
  description: |
   Onboard ESP32-C6 running ESP-Hosted over SDIO gives the radio-less ESP32-P4 Wi-Fi 6 and Bluetooth.
   The wifi and esp32_ble components only work while this is present.
  fields:
    type:
      value: sdio
      locked: true
    variant:
      value: ESP32C6
      locked: true
    active_high:
      value: true
      locked: true
    reset_pin:
      value: GPIO54
      locked: true
    clk_pin:
      value: GPIO18
      locked: true
    cmd_pin:
      value: GPIO19
      locked: true
    d0_pin:
      value: GPIO14
      locked: true
    d1_pin:
      value: GPIO15
      locked: true
    d2_pin:
      value: GPIO16
      locked: true
    d3_pin:
      value: GPIO17
      locked: true

- id: onboard_ethernet
  component_id: ethernet
  name: Onboard Ethernet
  description: Built-in IP101 Ethernet PHY (RMII) — selected automatically when a device is created without Wi-Fi credentials.
  fields:
    type:
      value: IP101
      locked: true
    mdc_pin:
      value: GPIO31
      locked: true
    mdio_pin:
      value: GPIO52
      locked: true
    clk:
      value:
        pin: GPIO50
        mode: CLK_EXT_IN
      locked: true
    phy_addr:
      value: 1
      locked: true
    power_pin:
      value: GPIO51
      locked: true
    # crs_dv/rxdv pin: GPIO28
    # rxd0 pin: GPIO29
    # rxd1 pin: GPIO30
    # txd0 pin: GPIO34
    # txd1 pin: GPIO35

- id: boot_button
  name: BOOT Button
  description: |
    Onboard "BOOT" button.
    Conflicts with Ethernet (GPIO35 is used for Ethernet PHY TXD1).
  component_id: binary_sensor.gpio
  fields:
    name: BOOT Button
    pin:
      value:
        number: GPIO35
        inverted: true
        ignore_strapping_warning: true
      locked: true
    id: boot_button

- id: i2c_bus
  name: Onboard / Shared I²C bus
  description: |
    The shared I²C bus used for onboard components (Audio codec),
    and available for external devices via the I²C connector,
    MIPI SCI and DSI connectors,
    and SDA/SCL pins on the 40pin header.
    This will also allow you to use some Raspberry Pi hats with I²C peripherals.
    Onboard components support max frequency 400kHz.
    If you connect additional peripherals, you may need to reduce the frequency.
  component_id: i2c
  fields:
    id:
      value: i2c_bus
      locked: true
    scl:
      value: GPIO8
      locked: true
    sda:
      value: GPIO7
      locked: true
    frequency: 400kHz
    # Board has external 2.2K I²C pullup resistors, but vendor sample code still enables internal pullups
    sda_pullup_enabled: true
    scl_pullup_enabled: true

- id: audio_bus
  component_id: i2s_audio
  fields:
    id:
      value: audio_bus
      locked: true
    i2s_lrclk_pin:
      value: GPIO10
      locked: true
    i2s_bclk_pin:
      value: GPIO12
      locked: true
    i2s_mclk_pin:
      value: GPIO13
      locked: true

- id: es8311_dac
  component_id: audio_dac.es8311
  fields:
    id:
      value: es8311_dac
      locked: true
    use_mclk:
      value: true
      locked: true
    use_microphone:
      value: false # false means analog mic
      locked: true
    address:
      value: 0x18
      locked: true
    i2c_id:
      value: i2c_bus
      locked: true
    bits_per_sample: 16bit
    sample_rate: 16000
  requires: [i2c_bus]

- id: audio_output
  component_id: speaker.i2s_audio
  fields:
    id: audio_output
    i2s_audio_id:
      value: audio_bus
      locked: true
    i2s_dout_pin:
      value: GPIO9
      locked: true
    audio_dac:
      value: es8311_dac
      locked: true
    dac_type:
      value: external
      locked: true
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 16000
  requires: [audio_bus, es8311_dac]

- id: audio_input
  component_id: microphone.i2s_audio
  fields:
    id: audio_input
    adc_type:
      value: external
      locked: true
    i2s_audio_id:
      value: audio_bus
      locked: true
    i2s_din_pin:
      value: GPIO11
      locked: true
    pdm:
      value: false
      locked: true
    bits_per_sample: 16bit
    sample_rate: 16000
  requires: [audio_bus, es8311_dac]

- id: audio_amplifier
