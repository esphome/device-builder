id: iotix-adam
name: IoTiX Adam
manufacturer: IoTiX
description: |
  ESP32 IoT controller designed in Romania by IoTiX, a "swiss knife" for
  home automation. It provides **16 digital inputs** and **16 digital
  outputs** on two onboard PCF8575 I/O expanders (I2C on GPIO21/GPIO22),
  plus an expansion slot for RS485, Ethernet or KNX daughterboards.

  Works with the IoTiX add-ons: **P8C** (8 x 5 A relays over I2C via RJ45),
  **NextSwitch** (RS485 wall-switch module) and **NextLight** (4-channel
  0-10 V dimmer over RS485 or Wi-Fi).

  Inputs and outputs are active-low, so both are configured with
  `inverted: true`.
esphome:
  platform: esp32
  board: esp32dev
  variant: esp32
hardware:
  connectivity:
  - wifi
  - bluetooth
tags:
- relay
product_url: https://www.tindie.com/products/iotix/adam/
docs_url: https://esphome.io/components/pcf8574/
images:
- https://img.tindie.com/images/resize/MH52KwU2KA39bkIgygOVt0P1vms=/p/1200x1200/smart/i/087323/products/2021-11-15T20:33:29.745Z-20211115_225717.jpg
full_config: true
pins:
- gpio: 0
  label: BOOT
  features:
  - strapping
  - boot_button
  available: false
  occupied_by: BOOT button
- gpio: 21
  label: SDA
  features:
  - i2c_sda
  available: false
  occupied_by: I2C bus (PCF8575 expanders, P8C)
- gpio: 22
  label: SCL
  features:
  - i2c_scl
  available: false
  occupied_by: I2C bus (PCF8575 expanders, P8C)
