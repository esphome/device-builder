featured_components:
- id: rgbpwr
  component_id: power_supply
  name: RGB LED power enable
  description: Load switch gating power to the onboard WS2812 RGB LED.
  fields:
    pin:
      value: 19
      locked: true
    id:
      value: rgbpwr
      locked: true
    enable_time: 5ms
    keep_on_time: 10ms
- id: rgb_led
  component_id: light.esp32_rmt_led_strip
  name: RGB LED
  description: Onboard WS2812 RGB LED.
  requires: [rgbpwr]
  fields:
    pin:
      value: 20
      locked: true
    name: RGB LED
    chipset: ws2812
    channel_colors: GRB
    num_leds: 1
    power_supply:
      value: rgbpwr
      locked: true
- id: status_led
  component_id: light.status_led
  name: Status LED
  description: Onboard blue status LED.
  fields:
    pin:
      value: 7
      locked: true
    name: Status LED
- id: button
  component_id: binary_sensor.gpio
  name: Button
  description: Front panel button. Also used to enter download mode at boot.
  fields:
    pin:
      value:
        number: 9
        mode:
          input: true
          pullup: true
        inverted: true
        ignore_strapping_warning: true
      locked: true
    name: Button
- id: ir_tx
  component_id: remote_transmitter
  name: IR Transmitter
  description: Onboard infrared LED.
  fields:
    pin:
      value: 3
      locked: true
    id:
      value: ir_tx
      locked: true
    carrier_duty_percent: 50%
- id: ir_proxy_tx
  component_id: infrared.ir_rf_proxy
  name: IR Proxy Transmitter
  requires: [ir_tx]
  fields:
    remote_transmitter_id:
      value: ir_tx
      locked: true
    name: IR Proxy Transmitter
- id: grove_i2c
  component_id: i2c
  name: Grove I2C
  description: 4-pin Grove port wired for I2C.
  fields:
    sda:
      value: 2
      locked: true
    scl:
      value: 1
      locked: true
featured_bundles:
- id: rgb_led_setup
  name: RGB LED (full setup)
  description: Power enable plus the WS2812 RGB LED entity.
  component_ids: [rgbpwr, rgb_led]
