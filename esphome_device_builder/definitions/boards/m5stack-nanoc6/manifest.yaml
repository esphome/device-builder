id: m5stack-nanoc6
name: M5Stack NanoC6
description: M5Stack NanoC6 is a tiny USB-C powered ESP32-C6 devkit (23.5 x 12mm) with Wi-Fi 6, Bluetooth 5, Zigbee 3.0, and
  Thread 1.3/Matter support. Onboard WS2812 RGB LED, infrared transmitter, blue status LED, a programmable button, and
  a 4-pin Grove port. 4 MB flash.
manufacturer: M5Stack
esphome:
  platform: esp32
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework: esp-idf
hardware:
  flash_size: 4MB
  ram_size: 327680
  cpu_frequency: 160MHz
  connectivity:
  - wifi
  - bluetooth
  - zigbee
  - thread
tags:
- compact
- usb-c
- rgb-led
docs_url: https://devices.esphome.io/devices/M5Stack-NanoC6/
product_url: https://docs.m5stack.com/en/core/M5NanoC6
images:
