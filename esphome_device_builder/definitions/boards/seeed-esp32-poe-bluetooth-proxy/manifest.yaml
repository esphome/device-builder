id: seeed-esp32-poe-bluetooth-proxy
name: Seeed Studio XIAO W5500 v1.2+ Bluetooth Proxy
description: Known, tested Home Assistant Bluetooth proxy — imported from the official esphome/bluetooth-proxies
  repo. New devices reference the upstream config as a remote package, picking up its updates on every
  build. Only XIAO W5500 Ethernet Adapters produced after November 1, 2025 (v1.2 or later) are supported.
