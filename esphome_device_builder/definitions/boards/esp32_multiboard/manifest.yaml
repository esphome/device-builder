id: esp32_multiboard
name: ESP32 Multiboard
description: Imported from devices.esphome.io — see linked docs for community notes.
esphome:
  platform: esp32
  board: esp32dev
  variant: esp32
hardware:
  connectivity:
  - wifi
  - bluetooth
images:
- https://raw.githubusercontent.com/esphome/devices.esphome.io/main/src/docs/devices/ESP32-Multiboard/MultiBoard.png
- https://raw.githubusercontent.com/esphome/devices.esphome.io/main/src/docs/devices/ESP32-Multiboard/Multiboard_Pinout.png
pins:
- gpio: 16
  available: false
  occupied_by: uart_bus
- gpio: 17
  available: false
  occupied_by: uart_bus
- gpio: 18
  available: false
  occupied_by: spi
- gpio: 19
  available: false
  occupied_by: spi
- gpio: 21
  available: false
  occupied_by: bus_a
- gpio: 22
  available: false
  occupied_by: bus_a
- gpio: 23
  available: false
  occupied_by: spi
- gpio: 25
  available: false
  occupied_by: Grove Digital Output (GPIO25)
- gpio: 26
  available: false
  occupied_by: Grove Digital Input (GPIO26)
- gpio: 34
  available: false
  occupied_by: Grove Analog (GPIO34)
- gpio: 35
  available: false
  occupied_by: Grove Analog (GPIO35)
docs_url: https://devices.esphome.io/devices/ESP32-Multiboard/
product_url: https://github.com/thebeaverdam/ESP32_MultiBoard
featured_components:
- id: bus_a
  component_id: i2c
  fields:
    sda:
      value: 21
      locked: true
    scl:
      value: 22
      locked: true
    scan: true
    id:
      value: bus_a
      locked: true
- id: uart_bus
  component_id: uart
  fields:
    tx_pin:
      value: 17
      locked: true
    rx_pin:
      value: 16
      locked: true
    baud_rate: 9600
    id:
      value: uart_bus
      locked: true
- id: spi_bus
  component_id: spi
  fields:
    clk_pin:
      value: 18
      locked: true
    mosi_pin:
      value: 23
      locked: true
    miso_pin:
      value: 19
      locked: true
- id: binary_sensor_gpio_1
  component_id: binary_sensor.gpio
  fields:
    pin:
      value:
        number: 26
        mode: INPUT_PULLUP
      locked: true
    id: binary_sensor_gpio_1
    name: Grove Digital Input (GPIO26)
- id: sensor_adc_1
  component_id: sensor.adc
  fields:
    pin:
      value: 35
      locked: true
    update_interval: 5s
    attenuation: 11db
    id: sensor_adc_1
    name: Grove Analog (GPIO35)
- id: sensor_adc_2
  component_id: sensor.adc
  fields:
    pin:
      value: 34
      locked: true
    update_interval: 5s
    attenuation: 11db
    id: sensor_adc_2
    name: Grove Analog (GPIO34)
- id: switch_gpio_1
  component_id: switch.gpio
  fields:
    pin:
      value: 25
      locked: true
    id: switch_gpio_1
    name: Grove Digital Output (GPIO25)
source:
  type: esphome-devices
  remote_id: ESP32-Multiboard
  upstream_url: https://github.com/esphome/devices.esphome.io/blob/main/src/docs/devices/ESP32-Multiboard/index.md
  upstream_revision: 003c7cc2abcfd0f24592769df72f967f362fc962
  content_hash: 3814c448903357f223e7c95441b8bba20ccc9f94ba6ccf29169306b5c3a5270f
