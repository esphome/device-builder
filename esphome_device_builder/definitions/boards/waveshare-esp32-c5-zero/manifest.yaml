id: waveshare-esp32-c5-zero
name: "Waveshare ESP32-C5-Zero"
description: |
  Ultra-compact ESP32-C5 development board with dual-band 2.4/5 GHz
  Wi-Fi 6, Bluetooth 5 (LE), and IEEE 802.15.4 (Zigbee 3.0/Thread).
  Castellated module, USB-C, onboard WS2812 RGB LED, BOOT and RESET
  buttons.
manufacturer: "Waveshare"

esphome:
  platform: esp32
  board: esp32-c5-devkitc-1
  variant: esp32c5
  framework: esp-idf

hardware:
  flash_size: 4MB
  ram_size: 327680
  cpu_frequency: 240MHz
  connectivity: [wifi, bluetooth, thread, zigbee]

tags: [compact, usb-c, rgb-led]
docs_url: "https://docs.waveshare.com/ESP32-C5-Zero"
product_url: "https://www.waveshare.com/esp32-c5-zero.htm"
is_generic: false

images:
  - "https://www.waveshare.com/media/catalog/product/cache/1/image/800x800/9df78eab33525d08d6e5fb8d27136e95/e/s/esp32-c5-zero-1.jpg"
  - "https://www.waveshare.com/media/catalog/product/cache/1/image/800x800/9df78eab33525d08d6e5fb8d27136e95/e/s/esp32-c5-zero-2.jpg"

